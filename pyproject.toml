[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-capability-token-granter"
version = "0.1.0"
description = "Fine-grained Macaroon-style capability token granter enforcing time-decaying, scoped tool permissions"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-capability-token-granter = "agent_capability_token_granter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_capability_token_granter*"]
